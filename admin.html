<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Angami Foods — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0d0f14;
    --surface:   #161b25;
    --card:      #1e2535;
    --border:    #2a3347;
    --accent:    #f28c28;
    --accent2:   #e07420;
    --green:     #22c55e;
    --red:       #ef4444;
    --blue:      #60a5fa;
    --text:      #e8ecf1;
    --muted:     #7a8699;
    --badge-new: rgba(242,140,40,0.15);
  }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── LOGIN OVERLAY ─────────────────────────────── */
  #loginOverlay {
    position: fixed; inset: 0;
    background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    z-index: 9999;
    transition: opacity .4s;
  }
  #loginOverlay.hide { opacity: 0; pointer-events: none; }

  .login-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 48px 40px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 24px 80px rgba(0,0,0,.6);
    text-align: center;
  }
  .login-logo {
    font-size: 13px; font-weight: 700; letter-spacing: 3px;
    color: var(--accent); margin-bottom: 8px;
  }
  .login-box h1 {
    font-size: 26px; font-weight: 700; margin-bottom: 6px;
  }
  .login-box p { color: var(--muted); font-size: 14px; margin-bottom: 32px; }

  .login-box label {
    display: block; text-align: left;
    font-size: 12px; font-weight: 600; letter-spacing: 1px;
    color: var(--muted); margin-bottom: 8px;
  }
  .pw-wrap { position: relative; }
  .login-box input[type="password"],
  .login-box input[type="text"] {
    width: 100%; padding: 14px 44px 14px 16px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; color: var(--text);
    font-size: 15px; font-family: inherit;
    outline: none; transition: border .2s;
  }
  .login-box input:focus { border-color: var(--accent); }
  #togglePw {
    position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
    background: none; border: none; color: var(--muted); cursor: pointer;
    font-size: 17px; padding: 0;
  }
  #loginBtn {
    margin-top: 20px; width: 100%;
    padding: 14px; border: none; border-radius: 10px;
    background: var(--accent); color: #fff;
    font-size: 14px; font-weight: 700; letter-spacing: 1px;
    cursor: pointer; transition: background .2s, transform .1s;
  }
  #loginBtn:hover  { background: var(--accent2); }
  #loginBtn:active { transform: scale(.98); }
  #loginError {
    margin-top: 14px; font-size: 13px; color: var(--red);
    min-height: 18px;
  }

  /* ── DASHBOARD ─────────────────────────────────── */
  #app { display: none; flex-direction: column; min-height: 100vh; }
  #app.visible { display: flex; }

  /* Header */
  .topbar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 32px;
    height: 64px;
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 100;
  }
  .topbar-brand {
    display: flex; align-items: center; gap: 12px;
  }
  .brand-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
  .brand-name { font-weight: 700; font-size: 15px; letter-spacing: 1px; }
  .brand-badge {
    background: rgba(242,140,40,.15); color: var(--accent);
    font-size: 11px; font-weight: 600; letter-spacing: 1px;
    padding: 3px 8px; border-radius: 6px; border: 1px solid rgba(242,140,40,.3);
  }
  .topbar-right { display: flex; align-items: center; gap: 16px; }
  #unreadBadge {
    background: var(--accent); color: #fff;
    font-size: 11px; font-weight: 700;
    padding: 3px 8px; border-radius: 20px;
    display: none;
  }
  .logout-btn {
    background: var(--card); border: 1px solid var(--border);
    color: var(--muted); font-size: 13px; font-weight: 500;
    padding: 8px 16px; border-radius: 8px; cursor: pointer;
    transition: color .2s, border-color .2s;
  }
  .logout-btn:hover { color: var(--red); border-color: var(--red); }

  /* Main */
  .main { flex: 1; padding: 32px; max-width: 1200px; margin: 0 auto; width: 100%; }

  /* Stats row */
  .stats-row {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 16px; margin-bottom: 32px;
  }
  .stat-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 20px 24px;
    position: relative; overflow: hidden;
    transition: transform .2s;
  }
  .stat-card:hover { transform: translateY(-2px); }
  .stat-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0;
    height: 3px; background: var(--accent); border-radius: 14px 14px 0 0;
  }
  .stat-card.green::before { background: var(--green); }
  .stat-card.blue::before  { background: var(--blue); }
  .stat-label { font-size: 12px; font-weight: 600; letter-spacing: 1px; color: var(--muted); margin-bottom: 8px; }
  .stat-value { font-size: 32px; font-weight: 700; }
  .stat-card.green .stat-value { color: var(--green); }
  .stat-card.blue  .stat-value { color: var(--blue); }

  /* Toolbar */
  .toolbar {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 20px; gap: 12px; flex-wrap: wrap;
  }
  .toolbar-title { font-size: 18px; font-weight: 700; }
  .toolbar-right { display: flex; gap: 10px; align-items: center; }
  .search-wrap { position: relative; }
  .search-wrap input {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 9px; color: var(--text);
    padding: 9px 14px 9px 36px; font-size: 13px; font-family: inherit;
    outline: none; width: 220px; transition: border .2s;
  }
  .search-wrap input:focus { border-color: var(--accent); }
  .search-icon {
    position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
    color: var(--muted); font-size: 14px; pointer-events: none;
  }
  .filter-btn {
    background: var(--surface); border: 1px solid var(--border);
    color: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: .5px;
    padding: 9px 14px; border-radius: 9px; cursor: pointer;
    transition: all .2s;
  }
  .filter-btn.active, .filter-btn:hover {
    border-color: var(--accent); color: var(--accent);
    background: rgba(242,140,40,.08);
  }
  #refreshBtn {
    background: var(--surface); border: 1px solid var(--border);
    color: var(--muted); padding: 9px 14px; border-radius: 9px; cursor: pointer;
    font-size: 16px; transition: color .2s, border-color .2s;
  }
  #refreshBtn:hover { color: var(--text); border-color: var(--text); }

  /* Table */
  .table-wrap {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; overflow: hidden;
  }
  table { width: 100%; border-collapse: collapse; }
  thead th {
    background: var(--card); padding: 14px 20px;
    text-align: left; font-size: 11px; font-weight: 700;
    letter-spacing: 1.2px; color: var(--muted);
    border-bottom: 1px solid var(--border);
  }
  tbody tr {
    border-bottom: 1px solid var(--border);
    transition: background .15s;
    cursor: default;
  }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: var(--card); }
  tbody tr.unread { background: rgba(242,140,40,.04); }
  tbody tr.unread:hover { background: rgba(242,140,40,.08); }
  td {
    padding: 16px 20px; font-size: 13.5px;
    vertical-align: top;
  }
  td.name-cell { font-weight: 600; }
  .new-pill {
    display: inline-block;
    background: var(--badge-new); color: var(--accent);
    font-size: 10px; font-weight: 700; letter-spacing: 1px;
    padding: 2px 7px; border-radius: 20px;
    border: 1px solid rgba(242,140,40,.3);
    vertical-align: middle; margin-left: 6px;
  }
  td .email-link { color: var(--blue); text-decoration: none; }
  td .email-link:hover { text-decoration: underline; }
  td .company-tag {
    color: var(--muted); font-size: 12px; margin-top: 2px;
  }
  td .msg-preview { color: var(--muted); font-size: 12.5px; max-width: 320px; }
  td .msg-full { display: none; }
  .expand-btn {
    background: none; border: none; color: var(--accent);
    font-size: 12px; cursor: pointer; padding: 0; margin-top: 4px;
    font-family: inherit;
  }
  .date-cell { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .actions-cell { display: flex; gap: 8px; align-items: center; }
  .read-btn {
    background: none; border: 1px solid var(--border);
    color: var(--muted); font-size: 11px; font-weight: 600;
    padding: 5px 10px; border-radius: 7px; cursor: pointer;
    transition: all .2s; white-space: nowrap;
  }
  .read-btn:hover { border-color: var(--green); color: var(--green); }
  .del-btn {
    background: none; border: 1px solid var(--border);
    color: var(--muted); font-size: 14px;
    padding: 5px 9px; border-radius: 7px; cursor: pointer;
    transition: all .2s;
  }
  .del-btn:hover { border-color: var(--red); color: var(--red); }

  /* Empty state */
  .empty-state {
    text-align: center; padding: 72px 24px; color: var(--muted);
  }
  .empty-state .e-icon { font-size: 48px; margin-bottom: 16px; }
  .empty-state h3 { font-size: 18px; font-weight: 600; color: var(--text); margin-bottom: 8px; }
  .empty-state p { font-size: 14px; }

  /* Toast */
  #toast {
    position: fixed; bottom: 28px; right: 28px;
    background: var(--card); border: 1px solid var(--border);
    color: var(--text); font-size: 13px; font-weight: 500;
    padding: 12px 20px; border-radius: 10px;
    box-shadow: 0 8px 32px rgba(0,0,0,.4);
    opacity: 0; transform: translateY(12px);
    transition: opacity .3s, transform .3s;
    pointer-events: none; z-index: 9000;
    display: flex; align-items: center; gap: 10px;
  }
  #toast.show { opacity: 1; transform: translateY(0); }
  #toast.success { border-color: var(--green); }
  #toast.error   { border-color: var(--red); }

  /* Loading spinner */
  .spinner {
    width: 20px; height: 20px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%; animation: spin .7s linear infinite;
    display: inline-block;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #loadingRow td { text-align: center; padding: 48px; }

  @media (max-width: 768px) {
    .main { padding: 20px 16px; }
    .topbar { padding: 0 16px; }
    table { font-size: 12px; }
    td, thead th { padding: 12px; }
    .search-wrap input { width: 160px; }
  }
</style>
</head>
<body>

<!-- ── LOGIN OVERLAY ───────────────────────────────────────────── -->
<div id="loginOverlay">
  <div class="login-box">
    <div class="login-logo">🌿 ANGAMI FOODS</div>
    <h1>Admin Portal</h1>
    <p>Enter your password to view inquiry data.</p>
    <label for="pwInput">PASSWORD</label>
    <div class="pw-wrap">
      <input id="pwInput" type="password" placeholder="••••••••••" autocomplete="current-password">
      <button id="togglePw" type="button" title="Show/hide">👁</button>
    </div>
    <div id="loginError"></div>
    <button id="loginBtn">SIGN IN</button>
  </div>
</div>

<!-- ── DASHBOARD ───────────────────────────────────────────────── -->
<div id="app">

  <header class="topbar">
    <div class="topbar-brand">
      <div class="brand-dot"></div>
      <span class="brand-name">ANGAMI FOODS</span>
      <span class="brand-badge">ADMIN</span>
    </div>
    <div class="topbar-right">
      <span id="unreadBadge"></span>
      <button class="logout-btn" id="logoutBtn">Sign Out</button>
    </div>
  </header>

  <main class="main">

    <!-- Stats -->
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-label">TOTAL INQUIRIES</div>
        <div class="stat-value" id="statTotal">—</div>
      </div>
      <div class="stat-card green">
        <div class="stat-label">UNREAD</div>
        <div class="stat-value" id="statUnread">—</div>
      </div>
      <div class="stat-card blue">
        <div class="stat-label">THIS MONTH</div>
        <div class="stat-value" id="statMonth">—</div>
      </div>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
      <span class="toolbar-title">Inquiry Log</span>
      <div class="toolbar-right">
        <div class="search-wrap">
          <span class="search-icon">🔍</span>
          <input id="searchInput" placeholder="Search name, email…" type="search">
        </div>
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="unread">Unread</button>
        <button id="refreshBtn" title="Refresh">↻</button>
      </div>
    </div>

    <!-- Table -->
    <div class="table-wrap">
      <table id="inquiryTable">
        <thead>
          <tr>
            <th>#</th>
            <th>CONTACT</th>
            <th>MESSAGE</th>
            <th>DATE</th>
            <th>ACTIONS</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr id="loadingRow"><td colspan="5"><div class="spinner"></div></td></tr>
        </tbody>
      </table>
    </div>

  </main>
</div>

<!-- Toast notification -->
<div id="toast"></div>

<script>
(function () {
  const SESSION_KEY = 'angami_admin_token';

  // ── Helpers ──────────────────────────────────────────────────
  const $  = id => document.getElementById(id);
  let authToken = sessionStorage.getItem(SESSION_KEY) || '';
  let allData   = [];
  let activeFilter = 'all';

  function toast(msg, type = 'success') {
    const t = $('toast');
    t.textContent  = (type === 'success' ? '✅ ' : '❌ ') + msg;
    t.className    = 'show ' + type;
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.className = '', 3000);
  }

  function formatDate(iso) {
    const d = new Date(iso);
    return d.toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric' })
      + ' · ' + d.toLocaleTimeString('en-IN', { hour:'2-digit', minute:'2-digit' });
  }

  // ── Auth ─────────────────────────────────────────────────────
  async function tryLogin() {
    const pw  = $('pwInput').value;
    const btn = $('loginBtn');
    const err = $('loginError');
    if (!pw) { err.textContent = 'Please enter the password.'; return; }

    btn.textContent = 'Signing in…';
    btn.disabled    = true;
    err.textContent = '';

    try {
      const res  = await fetch('/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: pw })
      });
      const data = await res.json();
      if (res.ok && data.token) {
        authToken = data.token;
        sessionStorage.setItem(SESSION_KEY, authToken);
        showDashboard();
      } else {
        err.textContent = data.error || 'Incorrect password.';
        $('pwInput').value = '';
        $('pwInput').focus();
      }
    } catch (e) {
      err.textContent = 'Server unreachable. Is node server.js running?';
    } finally {
      btn.textContent = 'SIGN IN';
      btn.disabled    = false;
    }
  }

  async function logout() {
    await fetch('/admin/logout', {
      method: 'POST',
      headers: { 'x-admin-token': authToken }
    }).catch(() => {});
    sessionStorage.removeItem(SESSION_KEY);
    authToken = '';
    location.reload();
  }

  // ── Dashboard ─────────────────────────────────────────────────
  function showDashboard() {
    $('loginOverlay').classList.add('hide');
    setTimeout(() => { $('loginOverlay').style.display = 'none'; }, 400);
    $('app').classList.add('visible');
    loadInquiries();
  }

  async function loadInquiries() {
    $('loadingRow').style.display = '';
    try {
      const res = await fetch('/api/admin/inquiries', {
        headers: { 'x-admin-token': authToken }
      });
      if (res.status === 401) { logout(); return; }
      allData = await res.json();
      renderTable();
      updateStats();
    } catch (e) {
      toast('Failed to load inquiries.', 'error');
    }
  }

  function updateStats() {
    const now   = new Date();
    const month = now.getMonth(); const year = now.getFullYear();
    const unread = allData.filter(i => !i.read).length;
    const thisMonth = allData.filter(i => {
      const d = new Date(i.created_at);
      return d.getMonth() === month && d.getFullYear() === year;
    }).length;

    $('statTotal').textContent  = allData.length;
    $('statUnread').textContent = unread;
    $('statMonth').textContent  = thisMonth;

    const badge = $('unreadBadge');
    if (unread > 0) {
      badge.textContent = unread + ' new';
      badge.style.display = 'inline';
    } else {
      badge.style.display = 'none';
    }
  }

  function getFilteredData() {
    let data = allData;
    const q  = $('searchInput').value.toLowerCase().trim();
    if (q) {
      data = data.filter(i =>
        i.name.toLowerCase().includes(q)    ||
        i.email.toLowerCase().includes(q)   ||
        (i.company || '').toLowerCase().includes(q) ||
        i.message.toLowerCase().includes(q)
      );
    }
    if (activeFilter === 'unread') data = data.filter(i => !i.read);
    return data;
  }

  function renderTable() {
    const tbody = $('tableBody');
    const data  = getFilteredData();
    $('loadingRow').style.display = 'none';

    // Remove old rows (keep loadingRow)
    [...tbody.querySelectorAll('tr:not(#loadingRow), tr.empty-tr')].forEach(r => r.remove());

    if (data.length === 0) {
      tbody.insertAdjacentHTML('beforeend', `
        <tr class="empty-tr"><td colspan="5">
          <div class="empty-state">
            <div class="e-icon">📭</div>
            <h3>No inquiries found</h3>
            <p>${activeFilter === 'unread' ? 'All caught up!' : 'No inquiries submitted yet.'}</p>
          </div>
        </td></tr>
      `);
      return;
    }

    data.forEach((item, idx) => {
      const msgShort = item.message.length > 80
        ? item.message.slice(0, 80) + '…'
        : item.message;

      const row = document.createElement('tr');
      row.className = item.read ? '' : 'unread';
      row.dataset.id = item.id;
      row.innerHTML = `
        <td style="color:var(--muted);font-size:12px;width:40px">${item.id}</td>
        <td class="name-cell">
          ${escHtml(item.name)}
          ${!item.read ? '<span class="new-pill">NEW</span>' : ''}
          <div class="company-tag">${escHtml(item.company || '')}</div>
          <div><a href="mailto:${escHtml(item.email)}" class="email-link">${escHtml(item.email)}</a></div>
        </td>
        <td>
          <div class="msg-preview">${escHtml(msgShort)}</div>
          ${item.message.length > 80 ? `
            <div class="msg-full" style="color:var(--muted);font-size:12.5px">${escHtml(item.message)}</div>
            <button class="expand-btn" onclick="toggleMsg(this)">Show more ↓</button>
          ` : ''}
        </td>
        <td class="date-cell">${formatDate(item.created_at)}</td>
        <td class="actions-cell">
          ${!item.read ? `<button class="read-btn" onclick="markRead(${item.id})">✓ Read</button>` : ''}
          <button class="del-btn" onclick="deleteEntry(${item.id})" title="Delete">🗑</button>
        </td>
      `;
      tbody.appendChild(row);
    });
  }

  function escHtml(str) {
    return String(str)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  window.toggleMsg = function(btn) {
    const row     = btn.closest('td');
    const preview = row.querySelector('.msg-preview');
    const full    = row.querySelector('.msg-full');
    if (full.style.display === 'block') {
      full.style.display = 'none'; preview.style.display = 'block'; btn.textContent = 'Show more ↓';
    } else {
      full.style.display = 'block'; preview.style.display = 'none'; btn.textContent = 'Show less ↑';
    }
  };

  window.markRead = async function(id) {
    try {
      const res = await fetch(`/api/admin/inquiries/${id}/read`, {
        method: 'PATCH',
        headers: { 'x-admin-token': authToken }
      });
      if (!res.ok) throw new Error();
      const item = allData.find(i => i.id === id);
      if (item) item.read = true;
      renderTable(); updateStats();
      toast('Marked as read');
    } catch { toast('Failed to update.', 'error'); }
  };

  window.deleteEntry = async function(id) {
    if (!confirm('Delete this inquiry? This cannot be undone.')) return;
    try {
      const res = await fetch(`/api/admin/inquiries/${id}`, {
        method: 'DELETE',
        headers: { 'x-admin-token': authToken }
      });
      if (!res.ok) throw new Error();
      allData = allData.filter(i => i.id !== id);
      renderTable(); updateStats();
      toast('Inquiry deleted');
    } catch { toast('Failed to delete.', 'error'); }
  };

  // ── Event Listeners ──────────────────────────────────────────
  $('loginBtn').addEventListener('click', tryLogin);
  $('pwInput').addEventListener('keydown', e => { if (e.key === 'Enter') tryLogin(); });
  $('togglePw').addEventListener('click', () => {
    const inp = $('pwInput');
    inp.type = inp.type === 'password' ? 'text' : 'password';
  });
  $('logoutBtn').addEventListener('click', logout);
  $('refreshBtn').addEventListener('click', loadInquiries);
  $('searchInput').addEventListener('input', renderTable);

  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', function () {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      activeFilter = this.dataset.filter;
      renderTable();
    });
  });

  // ── Init ─────────────────────────────────────────────────────
  if (authToken) {
    showDashboard();
  }
  // else: login overlay is already shown

})();
</script>
</body>
</html>
